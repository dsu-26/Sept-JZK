        <style>
            @import url('https://fonts.googleapis.com/css2?family=Jaini&display=swap');

            body {
                font-family: 'LucidaSans-Typewriter', regular;

            /* isometra-regular {

                    .siteheader{
                    right: 0;
                    top: 0;
                    width: auto;
                    height: auto;
                }
                .navcontainer{
                    position: absolute;
                    right: 0;
                    top: 0;
                    width: auto;
                    height: auto;
                    background-color: #c3bbe2;
                    padding: 5px;
                    box-shadow: 0px 2px 4px rgba(42, 24, 44, 0.2);
                    
                    }
				.buttonnav {
					background-color: #c3bbe2;
					color: rgb(137, 118, 135);
					padding: 15px 32px;
					text-align: match-parent;
					position: center;
					font-size: 16px;
					margin: 4px 4px;
					cursor: pointer;
				}
				a:link {
					color: rgb(96, 0, 128);
					background-color: transparent;
					text-decoration: none;
				}
				
				a:visited {
					color: rgb(98, 14, 88);
					background-color: transparent;
					text-decoration: none;
				}
				
				a:hover {
					color: rgb(32, 26, 32);
					background-color: transparent;
					text-decoration: underline;
				}
				
				a:active {
					color: rgb(255, 196, 0);
					background-color: transparent;
					text-decoration: underline;
				}
				.ulnav {
					list-style-type: none;
					margin: 0;
					padding: 0;
					overflow: hidden;
				}
				
				.ulnav li {
					float: left;
				}
				
				.ulnav li a {
					display: block;
					text-align: center;
					padding: 4px 6px;
					text-decoration: none;
				}
				
				.ulnav li a:hover {
					background-color: #111111;
				}
				.TOC{
					position: center;
					text-align: center;
					gap: 16px;				
				}
				.button-toc{
					font-family: "Isometra", serif;
					align-content: center;
					text-align: center;
					background-color: #b6afd1;
					box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2);
					gap: 16px; 
					padding: 25px; 
					border-radius: 65px;
					border: none;
					display: inline-flex;
					
					cursor: pointer;
					display: inline-flex;
					margin: 0 auto;
					max-width: 100%;
					overflow: hidden;
					white-space: nowrap;
					word-break: keep-all;
				}
				.button-toc:link{
					font-style: underline;
					font-family: "Isometra", serif;
				}
				.button-toc:visited{
					color: rgb(98, 14, 88);
					font-family: "Isometra", serif;				
				}
				.button-toc:hover{
				color:8E84A7;
				font-family: "Isometra", serif;
				
				}
				.button-toc:active{
					color: rgb(255, 196, 0);
					font-family: "Isometra", serif;				
				}
				.buttoncontainer{
					align-content: center;
					text-align: center;
					flex-direction: column;
					columns: 2;
					display: inline-flex;
					flex-wrap: wrap;
					justify-content: space-between;
					gap: 16px;
					font-family: "Isometra", serif;				
				}
				
			</style>
